[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posokanei"
dynamic = ["version"]
description = "Unofficial typed Python client for the price API behind posokanei.gov.gr"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kostas Konstantinidis" }]
keywords = ["posokanei", "greece", "supermarket", "prices", "api", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[project.urls]
Homepage = "https://github.com/kostaskonkk/python-posokanei"
Issues = "https://github.com/kostaskonkk/python-posokanei/issues"
Changelog = "https://github.com/kostaskonkk/python-posokanei/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",  # pinned: the drift check compares its output
    "jsonschema>=4.21",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pyyaml>=6",
    "respx>=0.21",
    "ruff==0.17.0",  # pinned: it formats the generated models
    "types-jsonschema",
    "types-pyyaml",
]

[tool.hatch.version]
path = "src/posokanei/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/posokanei"]

[tool.hatch.build.targets.sdist]
include = ["src", "spec", "tests", "README.md", "CHANGELOG.md", "LICENSE", "Makefile"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "A", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"src/posokanei/models.py" = ["E501"]  # generated; a description is as long as the spec's

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: calls the real API; run by hand with `pytest -m live`"]

[tool.coverage.run]
source = ["posokanei"]
omit = ["*/posokanei/models.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
