name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run make lint
      - run: uv run make type
      # The models are generated from the spec: a spec change without `make models` fails here.
      - run: uv run make drift
      # No test here calls the real API; those are `make live`, run by hand.
      - run: uv run make test
