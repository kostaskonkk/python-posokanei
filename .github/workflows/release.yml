name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    # These names are what PyPI's trusted publisher is set up for: this workflow file and this
    # environment. Renaming either breaks the release.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run make check
      - name: The tag is the package's version
        run: test "v$(uv run python -c 'import posokanei; print(posokanei.__version__)')" = "$GITHUB_REF_NAME"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
